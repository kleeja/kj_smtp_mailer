name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Lint PHP sources
        run: |
          for file in *.php; do
            php -l "$file"
          done

      - name: Build release archive
        run: |
          chmod +x build.sh
          ./build.sh "${GITHUB_REF_NAME}"

      - name: Attach archive to the release
        uses: softprops/action-gh-release@v2
        with:
          files: kj_smtp_mailer-*.zip
          fail_on_unmatched_files: true
